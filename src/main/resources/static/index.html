<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OAuth2 로그인 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            text-align: center;
        }

        .login-btn {
            display: inline-block;
            width: 250px;
            padding: 15px;
            margin: 10px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 5px;
        }

        .kakao {
            background-color: #FEE500;
            color: #191919;
        }

        .google {
            background-color: #4285F4;
        }
    </style>
</head>
<body>
<h2>Wordiga OAuth2 소셜 로그인 테스트</h2>
<hr>
<a class="login-btn kakao" href="/oauth2/authorization/kakao">카카오 로그인</a>
<br>
<a class="login-btn google" href="/oauth2/authorization/google">구글 로그인</a>
</body>
</html>
