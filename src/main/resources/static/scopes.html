<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카카오 동의항목 관리</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .result-box {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            word-break: break-all;
            margin-top: 15px;
            min-height: 100px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .req-btn {
            background-color: #dc3545;
            display: none;
            margin-top: 10px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #007BFF;
            text-decoration: none;
        }

        .error-iframe {
            width: 100%;
            height: 500px;
            border: 2px dashed #dc3545;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
<h2>카카오 사용자 동의항목 상세 조회</h2>
<hr>
<p>현재 백엔드 세션에 저장된 카카오 Access Token을 활용하여 인가 권한 내역을 실시간 조회합니다.</p>

<button class="btn" onclick="fetchKakaoScopes()">동의항목 데이터 가져오기</button>
<button class="btn req-btn" id="auth-trigger-btn" onclick="requestAdditionalScope()">⚠️ 프로필 사진 추가 동의하기</button>

<div class="result-box">
    <p><strong>조회 결과 데이터:</strong></p>
    <pre id="scopes-result">버튼을 누르면 카카오 리소스 서버의 응답 JSON이 출력됩니다.</pre>
    <iframe class="error-iframe" id="error-viewer"></iframe>
</div>

<a class="back-link" href="/callback.html">← 인증 결과 페이지로 돌아가기</a>

<script>
    async function fetchKakaoScopes() {
        const savedToken = sessionStorage.getItem('jwt_token');
        const resultElement = document.getElementById('scopes-result');
        const triggerBtn = document.getElementById('auth-trigger-btn');
        const errorViewer = document.getElementById('error-viewer');

        errorViewer.style.display = "none";
        resultElement.style.display = "block";

        if (!savedToken) {
            resultElement.innerText = "내부 인증 토큰(JWT)이 유실되었습니다. 로그인을 다시 진행하십시오.";
            return;
        }

        resultElement.innerText = "카카오 서버 통신 중...";

        try {
            const response = await fetch('/api/v1/auth/kakao/scopes', {
                method: 'GET',
                headers: {'Authorization': 'Bearer ' + savedToken}
            });

            const rawText = await response.text();
            const trimmedText = rawText.trim();

            // [IDE 파서 버그 차단] 기호를 분리 결합하여 마크업 오인 현상 제거
            const isHtmlResponse = trimmedText.startsWith("<" + "!DOCTYPE") ||
                trimmedText.startsWith("<" + "html") ||
                trimmedText.startsWith("<" + "body");

            if (!response.ok || isHtmlResponse) {
                resultElement.style.display = "none";
                errorViewer.style.display = "block";

                const doc = errorViewer.contentWindow.document;
                doc.open();
                doc.write(trimmedText.length > 0 ? trimmedText : "<h3>백엔드 서버 에러 발생 (Status Code: " + response.status + ")</h3>");
                doc.close();
                return;
            }

            const data = JSON.parse(trimmedText);
            resultElement.innerText = JSON.stringify(data, null, 4);

            const imageScope = data.scopes.find(s => s.id === 'profile_image');
            if (imageScope && imageScope.agreed === false) {
                triggerBtn.style.display = "inline-block";
            } else {
                triggerBtn.style.display = "none";
            }

        } catch (error) {
            resultElement.innerText = "데이터 통신/파싱 과정에서 예외가 발생했습니다:\n" + error.message;
        }
    }

    function requestAdditionalScope() {
        window.location.href = "/api/v1/auth/kakao/require-scope";
    }
</script>

</body>
</html>
