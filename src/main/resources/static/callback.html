<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OAuth2 인증 콜백</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .result-box {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            word-break: break-all;
            margin-bottom: 20px;
        }

        .profile-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ccc;
            background-color: #eee;
        }

        .api-btn {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn {
            background-color: #6c757d;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<h2>OAuth2 로그인 결과</h2>
<hr>

<h3>1. 카카오/구글 회원 정보 수신 결과</h3>
<div class="result-box">
    <div class="profile-container">
        <img alt="프로필 이미지 없음" class="profile-img" id="profile-img-view" src=""/>
        <div>
            <p style="margin: 5px 0;"><strong>닉네임:</strong> <span id="nickname-value">로딩 중...</span></p>
            <p style="margin: 5px 0;"><strong>이메일:</strong> <span id="email-value">로딩 중...</span></p>
        </div>
    </div>
    <br>
    <p><strong>발급된 JWT 토큰:</strong></p>
    <label for="token-value"></label><textarea id="token-value" readonly rows="4" style="width: 100%;"></textarea>
</div>

<h3>2. 페이지 이동 및 테스트</h3>
<button class="api-btn" onclick="callProtectedApi()">인증 API 호출 테스트</button>
<a class="api-btn nav-btn" href="/scopes.html">카카오 동의항목 페이지로 이동</a>

<div class="result-box" style="margin-top: 20px;">
    <p><strong>API 응답 결과:</strong></p>
    <pre id="api-result">버튼을 눌러 API를 호출하세요.</pre>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const nickname = urlParams.get('nickname');
    const email = urlParams.get('email');
    const profileImage = urlParams.get('profileImage');

    if (token) {
        document.getElementById('nickname-value').innerText = nickname ? decodeURIComponent(nickname) : "없음";
        document.getElementById('email-value').innerText = email ? decodeURIComponent(email) : "없음";
        document.getElementById('token-value').value = token;

        const imgUrl = profileImage ? decodeURIComponent(profileImage) : "";
        const imgElement = document.getElementById('profile-img-view');
        if (imgUrl) imgElement.src = imgUrl;
        else imgElement.style.display = "none";

        // 브라우저의 공유 스토리지 영역에 토큰 저장 (scopes.html에서 꺼내 쓸 자원)
        sessionStorage.setItem('jwt_token', token);
    } else {
        document.getElementById('nickname-value').innerText = '인증 실패 또는 데이터 없음';
        document.getElementById('email-value').innerText = '-';
    }

    function callProtectedApi() {
        const savedToken = sessionStorage.getItem('jwt_token');
        const resultElement = document.getElementById('api-result');

        if (!savedToken) {
            resultElement.innerText = "저장된 JWT 토큰이 없습니다.";
            return;
        }

        fetch('/api/v1/auth/test', {
            method: 'GET',
            headers: {'Authorization': 'Bearer ' + savedToken}
        })
            .then(response => {
                if (!response.ok) throw new Error("HTTP 오류 상태 코드: " + response.status);
                return response.text();
            })
            .then(data => {
                resultElement.innerText = data;
            })
            .catch(error => {
                resultElement.innerText = "호출 실패: " + error.message;
            });
    }
</script>
</body>
</html>
