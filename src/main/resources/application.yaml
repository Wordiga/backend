spring:
  application:
    name: wordiga

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [ openid, profile, email ]
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: [ openid, profile_nickname, profile_image, account_email ]
            client-name: Kakao
        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com

server:
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET}
  expiration-time: 3600000
  refresh-expiration: 604800000

kakao:
  admin-key: ${KAKAO_ADMIN_KEY:}
  url:
    unlink: https://apis.kakao.com/v1/user/unlink

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

tourism:
  region:
    chungnam-code: "44"
    chungnam-name: "충남"
  api:
    base-url: https://apis.data.go.kr/B551011
    service-key: ${TOUR_API_SERVICE_KEY}
    mobile-os: ETC
    mobile-app: WordigaApp
    default-num-of-rows: ${TOUR_API_DEFAULT_ROWS:10}

weather:
  api:
    base-url: https://apihub.kma.go.kr/api/typ02/openApi/AwsMtlyInfoService
    service-key: ${WEATHER_API_SERVICE_KEY:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:100s}

storage:
  kt:
    bucket: ${KT_S3_BUCKET:wordiga-storage}
    region: ${KT_S3_REGION:kr-standard}
    endpoint: ${KT_S3_ENDPOINT:https://obj-e-1.ktcloud.com}
    access-key: ${KT_S3_ACCESS_KEY:}
    secret-key: ${KT_S3_SECRET_KEY:}
    url-validity: 1d
    retention: 30d
    
logging:
  level:
    org.springframework.security: DEBUG
