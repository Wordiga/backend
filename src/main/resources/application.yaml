spring:
  application:
    name: wordiga

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI}
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com

jwt:
  secret: ${JWT_SECRET}
  expiration-time: 3600000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

tour-api:
  # 국문 관광정보 서비스 Open API Base URL (TourAPI 4.0 최신 운영서버)
  base-url: https://apis.data.go.kr/B551011/KorService2
  service-key: ${TOUR_API_SERVICE_KEY}

tourism:
  region:
    chungnam-code: "44"
  api:
    base-url: https://apis.data.go.kr/B551011
    service-key: ${TOUR_API_SERVICE_KEY}
    mobile-os: ETC
    mobile-app: WordigaApp
    default-num-of-rows: 10

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
    connect-timeout: 2s
    read-timeout: 45s

proposal:
  s3:
    bucket: ${PROPOSAL_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    url-validity: 1d
    retention: 30d

logging:
  level:
    org.springframework.security: DEBUG
