spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://wd-postgres-dev:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://ai:8000}

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.springframework.web: info
    org.wordiga: debug
