name: CD-KCL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-backend
  cancel-in-progress: true

env:
  IMAGE: glosona/wordiga-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run tests
        run: ./gradlew clean check --stacktrace

      - name: Build smoke-test image
        run: docker build -t wordiga-backend:smoke .

      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker network create wordiga-smoke

          docker run -d --name wd-postgres-dev --network wordiga-smoke --network-alias postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:17-alpine

          until docker exec wd-postgres-dev pg_isready -U postgres -d postgres; do
            sleep 2
          done

          docker run -d --name wordiga-backend-smoke --network wordiga-smoke -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod,smoke \
            wordiga-backend:smoke

          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs wordiga-backend-smoke
          exit 1

      - name: Clean up smoke containers
        if: always()
        run: |
          docker rm -f wordiga-backend-smoke wd-postgres-dev 2>/dev/null || true
          docker network rm wordiga-smoke 2>/dev/null || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: glosona
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to KT Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.KT_HOST }}
          username: ${{ vars.KT_USER }}
          key: ${{ secrets.KT_SSH_KEY }}
          envs: GITHUB_SHA,BACKEND_ENV
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/wordiga

            echo '[1/3] 환경변수 파일 동기화...'
            mkdir -p secrets
            printf '%s\n' "$BACKEND_ENV" > secrets/backend.env
            chmod 600 secrets/backend.env

            echo '[2/3] DB 서비스 기동 및 백엔드 재배포...'
            docker compose up -d postgres
            until docker compose exec -T postgres pg_isready -U wordiga -d wordiga; do
              sleep 2
            done
            BACKEND_IMAGE_TAG=$GITHUB_SHA docker compose pull backend
            BACKEND_IMAGE_TAG=$GITHUB_SHA docker compose up -d --no-deps backend
            docker compose up -d --no-deps caddy

            echo '[3/3] 백엔드 헬스체크 검증...'
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
                echo "배포 정상 완료 (소요: $((attempt * 2))초)"
                exit 0
              fi
              sleep 2
            done

            echo "배포 실패: 헬스체크 응답 없음. 백엔드 로그 확인:"
            docker compose logs --tail=200 backend
            exit 1
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
