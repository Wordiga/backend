name: CD-KCL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-backend
  cancel-in-progress: true

env:
  IMAGE: glosona/wordiga-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run tests
        run: ./gradlew clean check --stacktrace

      - name: Build smoke-test image
        run: docker build -t wordiga-backend:smoke .

      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker network create wordiga-smoke
          docker run -d --name wd-postgres-dev --network wordiga-smoke --network-alias postgres \
            -e POSTGRES_DB=wordiga \
            -e POSTGRES_USER=wordiga \
            -e POSTGRES_PASSWORD=wordiga-smoke-password \
            -v "$PWD/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" \
            postgres:17-alpine

          until docker exec wd-postgres-dev pg_isready -U wordiga -d wordiga; do sleep 2; done

          docker run -d --name wordiga-backend-smoke --network wordiga-smoke -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e POSTGRES_DB=wordiga \
            -e POSTGRES_USER=wordiga \
            -e POSTGRES_PASSWORD=wordiga-smoke-password \
            -e GOOGLE_CLIENT_ID=smoke \
            -e GOOGLE_CLIENT_SECRET=smoke \
            -e KAKAO_CLIENT_ID=smoke \
            -e KAKAO_CLIENT_SECRET=smoke \
            -e JWT_SECRET=wordiga-smoke-jwt-secret-at-least-32-bytes \
            -e TOUR_API_SERVICE_KEY=smoke \
            wordiga-backend:smoke

          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs wordiga-backend-smoke
          exit 1

      - name: Clean up smoke containers
        if: always()
        run: |
          docker rm -f wordiga-backend-smoke wd-postgres-dev 2>/dev/null || true
          docker network rm wordiga-smoke 2>/dev/null || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: glosona
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to KT Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.KT_HOST }}
          username: ${{ vars.KT_USER }}
          key: ${{ secrets.KT_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -eu
            trap 'rm -rf /run/wordiga' EXIT
            cd /opt/wordiga
            echo '[1/7] 환경변수 렌더링...'
            ./render-env.sh
            echo '[2/7] Postgres 시작...'
            docker compose up -d postgres
            echo '[3/7] DB 스키마 반영...'
            docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            ALTER TABLE proposals ADD COLUMN IF NOT EXISTS s3_key_pdf VARCHAR(500);
            ALTER TABLE tourism_content_snapshots ADD COLUMN IF NOT EXISTS source_modified_at TIMESTAMP;
            ALTER TABLE tourism_content_snapshots ADD COLUMN IF NOT EXISTS last_synced_at TIMESTAMP;
            WITH ranked AS (
                SELECT id, ROW_NUMBER() OVER (PARTITION BY plan_id ORDER BY created_at DESC, id DESC) AS row_number
                FROM proposals
            )
            DELETE FROM proposals
            WHERE id IN (SELECT id FROM ranked WHERE row_number > 1);
            CREATE UNIQUE INDEX IF NOT EXISTS uk_proposals_plan ON proposals (plan_id);
            SQL
            echo '[4/7] 백엔드 이미지 다운로드...'
            BACKEND_IMAGE_TAG=$GITHUB_SHA docker compose pull backend
            echo '[5/7] 백엔드 시작...'
            BACKEND_IMAGE_TAG=$GITHUB_SHA docker compose up -d --no-deps backend
            echo '[6/7] Caddy 기동 확인...'
            docker compose up -d --no-deps caddy
            echo '[7/7] 백엔드 상태 확인...'
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
                echo '배포 성공'
                exit 0
              fi
              sleep 2
            done
            docker compose ps backend
            docker compose logs --tail=200 backend
            exit 1
