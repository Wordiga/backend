name: CD-Deploy-Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to KT Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.KT_HOST }}
          username: ${{ vars.KT_USER }}
          key: ${{ secrets.KT_SSH_KEY }}
          envs: BACKEND_ENV
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/wordiga

            echo '[1/5] 환경변수 파일 동기화...'
            mkdir -p secrets
            printf '%s\n' "$BACKEND_ENV" > secrets/backend.env
            chmod 600 secrets/backend.env

            if [ -f "./render-env.sh" ]; then
              ./render-env.sh
            fi

            echo '[2/5] DB 서비스 기동 및 헬스 대기...'
            docker compose up -d postgres
            until docker compose exec -T postgres pg_isready -U wordiga -d wordiga; do
              sleep 2
            done

            echo '[3/5] DB 스키마 마이그레이션 적용...'
            docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            ALTER TABLE proposals ADD COLUMN IF NOT EXISTS s3_key_pdf VARCHAR(500);
            ALTER TABLE tourism_content_snapshots ADD COLUMN IF NOT EXISTS source_modified_at TIMESTAMP;
            ALTER TABLE tourism_content_snapshots ADD COLUMN IF NOT EXISTS last_synced_at TIMESTAMP;
            WITH ranked AS (
                SELECT id, ROW_NUMBER() OVER (PARTITION BY plan_id ORDER BY created_at DESC, id DESC) AS row_number
                FROM proposals
            )
            DELETE FROM proposals
            WHERE id IN (SELECT id FROM ranked WHERE row_number > 1);
            CREATE UNIQUE INDEX IF NOT EXISTS uk_proposals_plan ON proposals (plan_id);
            SQL

            echo '[4/5] Docker Hub 이미지 갱신 및 컨테이너 재배포...'
            docker compose pull backend
            docker compose up -d --no-deps backend
            docker compose up -d --no-deps caddy

            echo '[5/5] 백엔드 헬스체크 검증...'
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
                echo "배포 정상 완료 (소요: $((attempt * 2))초)"
                exit 0
              fi
              sleep 2
            done

            echo "배포 실패: 헬스체크 응답 없음. 백엔드 로그 확인:"
            docker compose logs --tail=200 backend
            exit 1
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
