name: CD-Deploy-Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to KT Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.KT_HOST }}
          username: ${{ vars.KT_USER }}
          key: ${{ secrets.KT_SSH_KEY }}
          envs: BACKEND_ENV
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/wordiga

            echo '[1/3] 환경변수 파일 동기화...'
            mkdir -p secrets
            printf '%s\n' "$BACKEND_ENV" > secrets/backend.env
            chmod 600 secrets/backend.env

            echo '[2/3] DB 서비스 기동 및 백엔드 재배포...'
            docker compose up -d postgres
            until docker compose exec -T postgres pg_isready -U wordiga -d wordiga; do
              sleep 2
            done
            docker compose pull backend
            docker compose up -d --no-deps backend
            docker compose up -d --no-deps caddy

            echo '[3/3] 백엔드 헬스체크 검증...'
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
                echo "배포 정상 완료 (소요: $((attempt * 2))초)"
                exit 0
              fi
              sleep 2
            done

            echo "배포 실패: 헬스체크 응답 없음. 백엔드 로그 확인:"
            docker compose logs --tail=200 backend
            exit 1
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
