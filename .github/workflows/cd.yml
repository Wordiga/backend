name: CD

on:
  # GitHub Actions 화면에서만 수동으로 실행합니다.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-backend
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  IMAGE: glosona/wordiga-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run tests
        # 운영 이미지를 만들기 전에 전체 검증을 실행합니다.
        run: ./gradlew clean check --stacktrace

      - name: Build smoke-test image
        # 현재 소스로 로컬 테스트 이미지를 만듭니다.
        run: docker build -t wordiga-backend:smoke .

      - name: Run container smoke test
        # 임시 DB와 가짜 키로 컨테이너 기동 여부만 확인합니다.
        shell: bash
        run: |
          set -euo pipefail
          docker network create wordiga-smoke
          docker run -d --name wd-postgres-dev --network wordiga-smoke --network-alias postgres \
            -e POSTGRES_DB=wordiga \
            -e POSTGRES_USER=wordiga \
            -e POSTGRES_PASSWORD=wordiga-smoke-password \
            -v "$PWD/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" \
            postgres:17-alpine

          until docker exec wd-postgres-dev pg_isready -U wordiga -d wordiga; do sleep 2; done

          docker run -d --name wordiga-backend-smoke --network wordiga-smoke -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod,smoke \
            -e POSTGRES_DB=wordiga \
            -e POSTGRES_USER=wordiga \
            -e POSTGRES_PASSWORD=wordiga-smoke-password \
            wordiga-backend:smoke

          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs wordiga-backend-smoke
          exit 1

      - name: Clean up smoke containers
        # 성공 여부와 관계없이 임시 컨테이너를 제거합니다.
        if: always()
        run: |
          docker rm -f wordiga-backend-smoke wd-postgres-dev 2>/dev/null || true
          docker network rm wordiga-smoke 2>/dev/null || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: glosona
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure deployment server is online
        # 중지된 배포 서버만 임시로 시작하고 SSM 연결을 기다립니다.
        shell: bash
        run: |
          set -euo pipefail
          STATE=$(aws ec2 describe-instances --instance-ids "$EC2_INSTANCE_ID" --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$STATE" = "stopped" ]; then
            echo "STOP_AFTER_DEPLOY=true" >> "$GITHUB_ENV"
            aws ec2 start-instances --instance-ids "$EC2_INSTANCE_ID" >/dev/null
            aws ec2 wait instance-running --instance-ids "$EC2_INSTANCE_ID"
          fi
          for _ in {1..30}; do
            STATUS=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$STATUS" = "Online" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Deploy backend through SSM
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA='${{ github.sha }}'
          REMOTE_COMMAND="DEPLOY_SHA=$DEPLOY_SHA; $(sed 's/^[[:space:]]*//' <<'REMOTE'
            set -eu
            trap 'rm -rf /run/wordiga' EXIT
            cd /opt/wordiga
            echo '[1/7] 환경변수 렌더링...'
            ./render-env.sh
            echo '[2/7] Postgres 시작...'
            docker compose up -d postgres
            echo '[3/7] DB 스키마 반영...'
            docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            ALTER TABLE proposals ADD COLUMN IF NOT EXISTS s3_key_pdf VARCHAR(500);
            ALTER TABLE tourism_content_snapshots ADD COLUMN IF NOT EXISTS source_modified_at TIMESTAMP;
            ALTER TABLE tourism_content_snapshots ADD COLUMN IF NOT EXISTS last_synced_at TIMESTAMP;
            WITH ranked AS (
                SELECT id, ROW_NUMBER() OVER (PARTITION BY plan_id ORDER BY created_at DESC, id DESC) AS row_number
                FROM proposals
            )
            DELETE FROM proposals
            WHERE id IN (SELECT id FROM ranked WHERE row_number > 1);
            CREATE UNIQUE INDEX IF NOT EXISTS uk_proposals_plan ON proposals (plan_id);
            SQL
            echo '[4/7] 백엔드 이미지 다운로드...'
            BACKEND_IMAGE_TAG=$DEPLOY_SHA docker compose pull backend
            echo '[5/7] 백엔드 시작...'
            BACKEND_IMAGE_TAG=$DEPLOY_SHA docker compose up -d --no-deps backend
            echo '[6/7] 백엔드 상태 확인...'
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
                echo '[7/7] 배포 성공'
                exit 0
              fi
              sleep 2
            done
            docker compose ps backend
            docker compose logs --tail=200 backend
            exit 1
          REMOTE
          )"
          PARAMETERS=$(jq -cn --arg command "$REMOTE_COMMAND" '{commands:[$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy backend $DEPLOY_SHA" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" || true
          INVOCATION=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID")
          echo "$INVOCATION" | jq '.'
          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi

      - name: Restore stopped state
        # CD가 시작한 서버만 다시 중지합니다.
        if: always() && env.STOP_AFTER_DEPLOY == 'true'
        run: aws ec2 stop-instances --instance-ids "$EC2_INSTANCE_ID"
